# workmux — config do repo (sobrepõe a global de ~/.config/workmux/config.yaml).
# Worktrees de task partem da dev (contrato do ciclo: PR contra dev + squash;
# review humana concentrada no PR dev→main). Fechamento é do `ship`, não do
# `workmux merge`.
base_branch: dev
main_branch: dev

# NUNCA rodar `make link` em post_create: o worktree sequestraria os symlinks
# globais de ~/.local/bin e o ship os deixaria dangling ao remover o worktree
# (bug pego em dogfood no primeiro ciclo completo). O link pertence ao
# checkout canônico (~/github/management-hub), uma vez.
